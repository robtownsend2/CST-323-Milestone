<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Video Rental - My Rentals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">VideoRental</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/catalog}">Catalog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/myrentals}">My Rentals</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/logout}">Logout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main cntent -->
<div class="container mt-5 pt-5">
    <h2 class="mb-4">My Rentals</h2>
    <div class="list-group">
        <div class="list-group-item" th:each="checkout : ${checkouts}">
            <h5 th:text="${checkout.movieTitle}">Movie Title</h5>
            <p>Checked Out By: <span th:text="${checkout.username}">Username</span></p>
            <a th:href="@{'/return/' + ${checkout.id}}" class="btn btn-success btn-sm">Return</a>
        </div>
    </div>
</div>

</body>
</html>
