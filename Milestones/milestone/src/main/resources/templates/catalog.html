<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Video Rental - Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 pt-5">
    <h2 class="mb-4">Movie Catalog</h2>
    <div class="row">
        <div class="col-md-4" th:each="movie : ${movies}">
            <div class="card">
                <img th:src="@{/images/logo.jpg}" class="card-img-top" alt="Movie Poster">
                <div class="card-body">
                    <h5 class="card-title" th:text="${movie.title}">Movie Title</h5>
                    <p class="card-text">Genre: <span th:text="${movie.genre}">Genre</span></p>
                    <p class="card-text">Price: $<span th:text="${movie.price}">0.00</span></p>
                    <p class="card-text">Status: <span th:text="${movie.status}">Available</span></p>
                    <a th:href="@{'/checkout/' + ${movie.id}}" class="btn btn-primary" th:if="${movie.status == 'Available'}">Checkout</a>
                    <button class="btn btn-secondary" disabled th:if="${movie.status != 'Available'}">Checked Out</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
